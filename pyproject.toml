[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "promptdiff"
version = "0.1.0"
description = "Compute and format diffs between prompt strings"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Vaibhav Deshmukh"}]
keywords = ["python", "prompt", "diff", "templates", "llm", "similarity"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
]

[project.scripts]
promptdiff = "promptdiff.__main__:_cli"

[project.urls]
"Homepage" = "https://github.com/vdeshmukh203/promptdiff"
"Source" = "https://github.com/vdeshmukh203/promptdiff"
"Bug Tracker" = "https://github.com/vdeshmukh203/promptdiff/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
promptdiff = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["promptdiff"]
branch = true

[tool.coverage.report]
show_missing = true
