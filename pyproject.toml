[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "promptdiff"
version = "0.2.0"
description = "Compute and format structured diffs between LLM prompt strings"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Vaibhav Deshmukh"}]
keywords = [
    "python",
    "prompt",
    "diff",
    "similarity",
    "large language models",
    "prompt engineering",
    "nlp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
    "Typing :: Typed",
]

[project.urls]
"Homepage"    = "https://github.com/vdeshmukh203/promptdiff"
"Source"      = "https://github.com/vdeshmukh203/promptdiff"
"Bug Tracker" = "https://github.com/vdeshmukh203/promptdiff/issues"

[project.scripts]
promptdiff-gui = "promptdiff.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
promptdiff = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
