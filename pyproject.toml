[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "promptdiff"
version = "0.1.0"
description = "Compute and format diffs between prompt strings"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Vaibhav Deshmukh"}]
keywords = ["python", "prompt", "diff", "templates"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/vdeshmukh203/promptdiff"
"Source" = "https://github.com/vdeshmukh203/promptdiff"

[tool.setuptools.packages.find]
where = ["src"]
