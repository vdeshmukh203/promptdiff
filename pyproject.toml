[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "promptdiff"
version = "0.2.0"
description = "Compute and format diffs between prompt strings"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Vaibhav Deshmukh"}]
keywords = ["python", "prompt", "diff", "llm", "similarity", "prompt-engineering"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.scripts]
promptdiff-gui = "promptdiff.gui:main"

[project.urls]
"Homepage" = "https://github.com/vdeshmukh203/promptdiff"
"Source" = "https://github.com/vdeshmukh203/promptdiff"
"Bug Tracker" = "https://github.com/vdeshmukh203/promptdiff/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
promptdiff = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["promptdiff"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src"]
